name: GuruKit uptime
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gurukit-uptime
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public application and database health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 https://gurukit-rho.vercel.app/api/health -o health.json && python3 -c 'import json; d=json.load(open("health.json")); assert d.get("status")=="ok"; print("GuruKit health:",d["status"],"version:",d.get("version"))'; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done
          exit 1
