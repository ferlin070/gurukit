name: Supabase full backup to Google Drive

on:
  schedule:
    - cron: '0 20 * * *'   # 04:00 MYT (UTC+8) harian
  workflow_dispatch:

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Dump database (PostgreSQL 17 via docker, custom format)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pg_dump mesti sepadan versi pelayan (17). Session pooler diperlukan
          # (transaction pooler tidak menyokong pg_dump).
          docker run --rm -v /tmp:/out -e URL="$SUPABASE_DB_URL" postgres:17-alpine \
            sh -c 'pg_dump "$URL" --format=custom --no-owner --no-privileges -f /out/gurukit-full.dump && pg_dump --version'
          ls -la /tmp/gurukit-full.dump

      - name: Export roles + auth snapshot SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cat > /tmp/roles.sql <<'SQL'
          select 'CREATE ROLE "' || rolname || '";' as ddl
          from pg_roles
          where rolname not in (
            'postgres','authenticator','anon','authenticated','service_role',
            'supabase_admin','supabase_auth_admin','supabase_storage_admin',
            'supabase_realtime_admin','pgbouncer','pg_read_all_data','pg_write_all_data'
          )
          and rolname not like 'pg_%'
          order by rolname;
          SQL
          docker run --rm -i -v /tmp:/out -e URL="$SUPABASE_DB_URL" postgres:17-alpine \
            sh -c 'psql "$URL" -At -f /dev/stdin > /out/roles-snapshot.txt' < /tmp/roles.sql || true
          wc -l /tmp/roles-snapshot.txt || true

      - name: Export auth/config metadata note
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cat > /tmp/note.sql <<'SQL'
          select jsonb_pretty(jsonb_build_object(
            'exported_at', now(),
            'auth_users_count', (select count(*) from auth.users),
            'auth_identities_count', (select count(*) from auth.identities),
            'mfa_factors_count', (select count(*) from auth.mfa_factors),
            'storage_buckets', (select jsonb_agg(name) from storage.buckets),
            'note', 'SMTP credentials, OAuth provider client secrets, redirect URLs dan tetapan dashboard Auth TIDAK termasuk dalam dump DB - eksport berasingan dari dashboard.'
          ));
          SQL
          docker run --rm -i -v /tmp:/out -e URL="$SUPABASE_DB_URL" postgres:17-alpine \
            sh -c 'psql "$URL" -At -f /dev/stdin > /out/auth-note.json' < /tmp/note.sql

      - name: Encrypt (AES-256-GCM)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          cat > /tmp/encrypt.mjs <<'EOF'
          import { createCipheriv, randomBytes, scryptSync } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const key32 = scryptSync(process.env.BACKUP_ENCRYPTION_KEY, 'gurukit-backup-v1', 32);
          for (const f of process.argv.slice(2)) {
            const iv = randomBytes(12);
            const c = createCipheriv('aes-256-gcm', key32, iv);
            const data = readFileSync(f);
            const ct = Buffer.concat([c.update(data), c.final()]);
            const out = Buffer.concat([Buffer.from('GKBK1'), iv, ct, c.getAuthTag()]);
            writeFileSync(f + '.enc', out);
            console.log(f + '.enc', out.length, 'bytes');
          }
          EOF
          node /tmp/encrypt.mjs /tmp/gurukit-full.dump /tmp/roles-snapshot.txt /tmp/auth-note.json
          DATE=$(date -u +%F)
          mv /tmp/gurukit-full.dump.enc "/tmp/gurukit-supabase-full-${DATE}.enc"
          mv /tmp/roles-snapshot.txt.enc "/tmp/gurukit-roles-${DATE}.enc"
          mv /tmp/auth-note.json.enc "/tmp/gurukit-authnote-${DATE}.enc"
          sha256sum /tmp/gurukit-*.enc > /tmp/checksums.txt
          cat /tmp/checksums.txt

      - name: Upload to Google Drive
        env:
          DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          cat > /tmp/drive-upload.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          const cid = process.env.DRIVE_CLIENT_ID;
          const cs = process.env.DRIVE_CLIENT_SECRET;
          const rt = process.env.DRIVE_REFRESH_TOKEN;
          const tok = await (await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ client_id: cid, client_secret: cs, refresh_token: rt, grant_type: 'refresh_token' })
          })).json();
          if (!tok.access_token) throw new Error('token refresh gagal: ' + JSON.stringify(tok).slice(0, 200));
          const at = tok.access_token;
          async function ensureFolder() {
            const q = encodeURIComponent("name = 'GuruKit Backups' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
            const r = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers: { Authorization: `Bearer ${at}` } })).json();
            if (r.files?.length) return r.files[0].id;
            const c = await (await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
              method: 'POST', headers: { Authorization: `Bearer ${at}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: 'GuruKit Backups', mimeType: 'application/vnd.google-apps.folder' })
            })).json();
            return c.id;
          }
          const folderId = await ensureFolder();
          for (const f of process.argv.slice(2)) {
            const meta = { name: f.split('/').pop(), parents: [folderId] };
            const fd = new FormData();
            fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
            fd.append('file', new Blob([readFileSync(f)]));
            const up = await (await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,size', {
              method: 'POST', headers: { Authorization: `Bearer ${at}` }, body: fd
            })).json();
            if (!up.id) throw new Error('upload gagal: ' + JSON.stringify(up).slice(0, 200));
            console.log('uploaded', meta.name, JSON.stringify(up));
          }
          EOF
          DATE=$(date -u +%F)
          node /tmp/drive-upload.mjs "/tmp/gurukit-supabase-full-${DATE}.enc" "/tmp/gurukit-roles-${DATE}.enc" "/tmp/gurukit-authnote-${DATE}.enc" /tmp/checksums.txt

      - name: Summary
        if: always()
        run: |
          echo "## Supabase backup run $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          echo "- Dump: pg_dump 17 (custom format), schema public + auth + storage" >> $GITHUB_STEP_SUMMARY
          echo "- Enkripsi: AES-256-GCM sebelum upload" >> $GITHUB_STEP_SUMMARY
          echo "- Destinasi: Google Drive / GuruKit Backups" >> $GITHUB_STEP_SUMMARY
          echo "- Pengecualian: role password hash, SMTP/OAuth auth config (dashboard), fail Storage S3" >> $GITHUB_STEP_SUMMARY
