name: Supabase restore drill

on:
  workflow_dispatch:
    inputs:
      dump_file:
        description: 'Nama fail dump .enc di Drive (kosong = terkini gurukit-supabase-full-*)'
        required: false
        default: ''

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download + decrypt dump
        env:
          DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          WANT: ${{ github.event.inputs.dump_file }}
        run: |
          cat > /tmp/fetch.mjs <<'EOF'
          import { writeFileSync } from 'node:fs';
          const cid = process.env.DRIVE_CLIENT_ID, cs = process.env.DRIVE_CLIENT_SECRET, rt = process.env.DRIVE_REFRESH_TOKEN;
          const tok = await (await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: cid, client_secret: cs, refresh_token: rt, grant_type: 'refresh_token' }) })).json();
          const at = tok.access_token;
          const q = encodeURIComponent("name = 'GuruKit Backups' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
          const folder = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, { headers: { Authorization: `Bearer ${at}` } })).json();
          const fid = folder.files[0].id;
          const want = process.env.WANT;
          const q2 = encodeURIComponent(`'${fid}' in parents and name contains 'gurukit-supabase-full-' and trashed = false`);
          const lst = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=${q2}&fields=files(id,name,createdTime)&orderBy=createdTime desc&pageSize=20`, { headers: { Authorization: `Bearer ${at}` } })).json();
          // pilih nama paling baru (dupe boleh wujud) — guna createdTime terkini per nama
          const byName = {};
          for (const f of lst.files || []) {
            if (!byName[f.name] || f.createdTime > byName[f.name].createdTime) byName[f.name] = f;
          }
          const names = Object.keys(byName).sort();
          const chosen = want ? names.find(n => n === want) : names[names.length - 1];
          if (!chosen) throw new Error('dump tidak dijumpai');
          const bin = await (await fetch(`https://www.googleapis.com/drive/v3/files/${byName[chosen].id}?alt=media`, { headers: { Authorization: `Bearer ${at}` } })).arrayBuffer();
          writeFileSync('/tmp/dump.enc', Buffer.from(bin));
          console.log('chosen:', chosen);
          EOF
          node /tmp/fetch.mjs
          cat > /tmp/decrypt.mjs <<'EOF'
          import { createDecipheriv, scryptSync } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const key32 = scryptSync(process.env.BACKUP_ENCRYPTION_KEY, 'gurukit-backup-v1', 32);
          const data = readFileSync('/tmp/dump.enc');
          if (data.subarray(0, 5).toString() !== 'GKBK1') throw new Error('magic tidak sah');
          const c = createDecipheriv('aes-256-gcm', key32, data.subarray(5, 17));
          c.setAuthTag(data.subarray(data.length - 16));
          const plain = Buffer.concat([c.update(data.subarray(17, data.length - 16)), c.final()]);
          writeFileSync('/tmp/gurukit-full.dump', plain);
          console.log('decrypted', plain.length, 'bytes');
          EOF
          node /tmp/decrypt.mjs

      - name: Restore ke projek drill
        env:
          DRILL_DB_URL: ${{ secrets.DRILL_DB_URL }}
        run: |
          docker run --rm -i -v /tmp:/out -e URL="$DRILL_DB_URL" postgres:17-alpine \
            sh -c 'pg_restore --version && pg_restore -d "$URL" --no-owner --no-privileges /out/gurukit-full.dump; echo "exit=$?"' 2>&1 | tee /tmp/restore.log
          # ralat yang boleh diterima: sambungan ke objek sistem/role yang tidak wujud
          ! grep -qE 'FATAL' /tmp/restore.log

      - name: Verifikasi data & auth
        env:
          DRILL_DB_URL: ${{ secrets.DRILL_DB_URL }}
        run: |
          cat > /tmp/verify.sql <<'SQL'
          select 'auth_users' as k, count(*)::text as v from auth.users
          union all
          select 'auth_identities', count(*)::text from auth.identities
          union all
          select 'mfa_factors', count(*)::text from auth.mfa_factors
          union all
          select 'sessions', count(*)::text from auth.sessions
          union all
          select 'refresh_tokens', count(*)::text from auth.refresh_tokens
          union all
          select 'public_tables', count(*)::text from information_schema.tables where table_schema = 'public'
          union all
          select 'storage_buckets', count(*)::text from storage.buckets;
          SQL
          docker run --rm -i -e URL="$DRILL_DB_URL" postgres:17-alpine \
            sh -c 'psql "$URL" -At -f /dev/stdin' < /tmp/verify.sql | tee /tmp/verify.out
          USERS=$(grep auth_users /tmp/verify.out | cut -d'|' -f2)
          TABLES=$(grep public_tables /tmp/verify.out | cut -d'|' -f2)
          echo "users=$USERS public_tables=$TABLES"
          [ "${USERS:-0}" -ge 1 ] && [ "${TABLES:-0}" -ge 3 ]

      - name: Uji GoTrue login kata laluan (akaun ujian)
        env:
          DRILL_ANON_KEY: ${{ secrets.DRILL_ANON_KEY }}
          DRILL_SERVICE_ROLE: ${{ secrets.DRILL_SERVICE_ROLE }}
          DRILL_DB_URL: ${{ secrets.DRILL_DB_URL }}
        run: |
          REF=$(echo "$DRILL_DB_URL" | sed -E 's|.*postgres\.([a-z0-9]+):.*|\1|')
          echo "drill ref: $REF"
          # 1) cipta akaun ujian melalui admin API (service_role)
          TEST_EMAIL="restore-drill-$(date +%s)@ghazwahgroup.com"
          TEST_PW="Dr1ll-$(openssl rand -hex 8)!"
          CREATE=$(curl -s -o /tmp/create.json -w '%{http_code}' -X PUT \
            "https://$REF.supabase.co/auth/v1/admin/users" \
            -H "apikey: $DRILL_SERVICE_ROLE" -H "Authorization: Bearer $DRILL_SERVICE_ROLE" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PW\",\"email_confirm\":true,\"user_metadata\":{\"source\":\"restore-drill\"}}")
          echo "create user: $CREATE"
          [ "$CREATE" = "200" ] || { cat /tmp/create.json; exit 1; }
          # 2) login kata laluan melalui GoTrue (anon key)
          LOGIN=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST \
            "https://$REF.supabase.co/auth/v1/token?grant_type=password" \
            -H "apikey: $DRILL_ANON_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PW\"}")
          echo "login: $LOGIN"
          ACCESS=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('/tmp/login.json')).access_token||'')}catch(e){}")
          [ -n "$ACCESS" ] || { cat /tmp/login.json; exit 1; }
          echo "LOGIN OK - hash kata laluan terpulihara & GoTrue berfungsi"
          # 3) padam akaun ujian
          UID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/create.json')).id)")
          curl -s -X DELETE "https://$REF.supabase.co/auth/v1/admin/users/$UID" \
            -H "apikey: $DRILL_SERVICE_ROLE" -H "Authorization: Bearer $DRILL_SERVICE_ROLE" > /dev/null
          echo "test user dibersihkan"

      - name: Summary
        if: always()
        run: |
          echo "## Restore drill $(date -u +%F %H:%M UTC)" >> $GITHUB_STEP_SUMMARY
          echo "- Restore ke projek Supabase berasingan (bukan production)" >> $GITHUB_STEP_SUMMARY
          echo "- Data/auth/identities disahkan + GoTrue password login diuji" >> $GITHUB_STEP_SUMMARY
